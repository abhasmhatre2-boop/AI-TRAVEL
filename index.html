<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIP.AI | Global Expedition Manifest</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/topojson-client"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(70%) sepia(50%) saturate(500%) hue-rotate(10deg);
            cursor: pointer;
        }
        :root {
            --gold: #d4af37;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--dark); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        /* NAVIGATION BAR */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 6%; position: fixed; width: 100%; z-index: 1000;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.4rem; letter-spacing: 6px; font-weight: 700; color: var(--gold); }
        
        .nav-controls { display: flex; align-items: center; gap: 20px; }
        
        select.lang-select {
            background: transparent; color: #fff; border: 1px solid var(--border);
            padding: 5px 10px; font-size: 0.7rem; text-transform: uppercase; cursor: pointer;
        }

        /* LOGIN BUTTON & VAULT BUTTON */
        #google-login-btn { transform: scale(0.9); }
        .vault-btn {
            padding: 10px 20px; font-size: 0.6rem; border: 1px solid var(--gold);
            background: transparent; color: var(--gold); cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .vault-btn:hover { background: var(--gold); color: #000; }

        /* HERO SECTION */
        /* --- CINEMATIC AURORA HERO --- */
        .hero {
            position: relative;
            height: 100vh; 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            overflow: hidden; /* Keeps the glowing orbs inside the section */
        }
        
        .hero-content {
            position: relative;
            z-index: 2; /* Keeps the text in front of the background */
            display: flex; flex-direction: column; align-items: center;
        }

        .hero h1 { font-size: clamp(3rem, 10vw, 7rem); line-height: 1; margin-bottom: 20px; }
        .hero p { color: var(--gold); letter-spacing: 8px; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 40px; }

        /* The Animated Background Layer */
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #020202; /* Deepest black */
            z-index: 0;
        }

        /* The Glowing Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px); /* Creates the soft, smokey aurora effect */
            opacity: 0.5;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 45vw; height: 45vw;
            background: rgba(212, 175, 55, 0.15); /* Trip.AI Gold */
            top: -10%; left: -10%;
        }

        .orb-2 {
            width: 55vw; height: 55vw;
            background: rgba(58, 130, 246, 0.12); /* Subtle Globe Atmosphere Blue */
            bottom: -20%; right: -10%;
            animation-delay: -5s; /* Offsets the animation so they don't move identically */
        }

        .orb-3 {
            width: 35vw; height: 35vw;
            background: rgba(212, 175, 55, 0.08); /* Faint Gold Center */
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 25s;
        }

        /* The Drift Animation */
        @keyframes drift {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(8vw, 4vh) scale(1.05); }
            100% { transform: translate(-4vw, 8vh) scale(0.95); }
        }

        /* GLOBE & CONTENT */
        .globe-container { width: 100%; height: 700px; background: #000; border-top: 1px solid var(--border); }
        
        /* DASHBOARD UI */
        #dashboardUI { padding: 120px 8%; min-height: 100vh; background: #0a0a0a; display: none; }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 40px; }
        .archive-card { padding: 40px; background: var(--glass); border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
        .archive-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        /* MODAL & FORM */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .m-content { background: #111; padding: 50px; width: 90%; max-width: 550px; border: 1px solid var(--border); position: relative; }
        .close-btn { position: absolute; top: 20px; right: 25px; cursor: pointer; font-size: 2rem; color: #444; }

        input, select {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            color: #fff; padding: 12px 0; margin-bottom: 30px; font-size: 1rem;
        }
        input:focus { border-color: var(--gold); outline: none; }
        label { display: block; font-size: 0.6rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }

        /* RESULTS AREA */
        .results-page { padding: 120px 8%; max-width: 1300px; margin: 0 auto; }
        .budget-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
            margin-bottom: 60px; background: var(--glass); padding: 30px; border: 1px solid var(--border);
        }
        .budget-item small { display: block; color: var(--gold); font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 10px; }

        .day-row { display: grid; grid-template-columns: 150px 1fr; gap: 50px; padding: 60px 0; border-top: 1px solid var(--border); }
        .day-num { font-size: 5rem; color: var(--gold); opacity: 0.1; }
        .day-theme { font-style: italic; font-size: 1.4rem; margin-top: 10px; font-family: 'Playfair Display'; }
        
        .act-group { border-left: 1px solid #222; padding-left: 40px; }
        .act-block { margin-bottom: 30px; }
        .act-block p { font-weight: 200; color: #aaa; line-height: 1.8; }

        .hidden { display: none !important; }
        /* --- QUANTUM RADAR LOADER --- */
#loadingUI {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
}

#loadingUI.hidden {
    display: none !important;
}

.cyber-loader {
    position: relative;
    width: 60px;
    height: 60px;
    margin-bottom: 25px;
}

/* The Outer Orbital Ring */
.cyber-loader .ring:nth-child(1) {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
    animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
}

/* The Inner Orbital Ring */
.cyber-loader .ring:nth-child(2) {
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    border-radius: 50%;
    border: 1px solid transparent;
    border-bottom: 1px solid rgba(212, 175, 55, 0.4);
    border-left: 1px solid rgba(212, 175, 55, 0.4);
    animation: spin 1.5s linear infinite reverse;
}

/* The Pulsing Core */
.cyber-loader .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 15px 2px var(--gold);
    animation: corePulse 1s ease-in-out infinite alternate;
}

/* The Glowing Text */
.loader-text {
    color: var(--gold);
    letter-spacing: 6px;
    font-size: 0.55rem;
    text-transform: uppercase;
    animation: textGlow 1.5s ease-in-out infinite alternate;
}

/* Animation Keyframes */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes corePulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; box-shadow: 0 0 25px 4px var(--gold); }
}

@keyframes textGlow {
    0% { opacity: 0.5; text-shadow: none; }
    100% { opacity: 1; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); }
}
    </style>
</head>
<body>

    <nav>
        <div class="logo">TRIP.AI</div>
        <div class="nav-controls">
            <button class="vault-btn" onclick="toggleDashboard()">Access Vault</button>
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="es">Español</option>
            </select>
            <div id="google-login-btn"></div>
        </div>
    </nav>

    <div id="mainUI">
       <section class="hero">
            <div class="hero-bg">
                <div class="orb orb-1"></div>
                <div class="orb orb-2"></div>
                <div class="orb orb-3"></div>
            </div>
            
            <div class="hero-content">
                <p id="txt-subhero">Intelligence in Global Travel</p>
                <h1 id="txt-hero">The World,<br>By Design.</h1>
                <button class="btn open-modal" id="txt-btn-main">Begin Configuration</button>
                <p style="margin-top: 60px; font-size: 0.6rem; opacity: 0.5; animation: corePulse 2s infinite;">Scroll to explore the engine</p>
            </div>
        </section>

        <section class="globe-container">
            <div id="globeViz"></div>
        </section>
    </div>

    <div id="dashboardUI">
        <h2 style="font-size: 3rem; border-bottom: 1px solid #333; padding-bottom: 20px;">Dossier Vault</h2>
        <div id="archiveDisplay" class="archive-grid">Synchronizing records...</div>
        <button class="btn" onclick="location.reload()" style="margin-top: 50px;">Return Home</button>
    </div>

    <section id="resultUI" class="results-page hidden">
        <div style="margin-bottom: 80px;">
            <p id="rMeta" style="color: var(--gold); letter-spacing: 4px; font-size: 0.7rem; margin-bottom: 10px;"></p>
            <h1 id="rDest" style="font-size: 5rem; margin-bottom: 40px;"></h1>
            <div id="weatherBadge" style="display: inline-block; padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); margin-bottom: 30px;">
                <small style="color: var(--gold); letter-spacing: 2px; text-transform: uppercase; font-size: 0.5rem; display: block;">Local Climate</small>
                <span id="weatherText" style="font-size: 1.1rem; font-weight: 200;">Syncing...</span>
            </div>
            <div class="budget-grid">
                <div class="budget-item"><small>Live Airfare</small><h3 id="costFlight">-</h3></div>
                <div class="budget-item"><small>Live Hotel</small><h3 id="costHotel">-</h3></div>
                <div class="budget-item"><small>Daily Spending</small><h3 id="costDaily">-</h3></div>
                <div class="budget-item"><small>Total Budget</small><h3 id="costTotal" style="color: var(--gold);">-</h3></div>
            </div>

            <div style="display: flex; gap: 20px;">

                <button id="downloadPdf" class="btn">Export PDF</button>
                <button class="btn" style="border-color: #333; color: #555;" onclick="location.reload()">Return</button>
            </div>
        </div>
        <div id="itineraryFlow"></div>
    </section>

    <div id="modalUI" class="modal">
        <div class="m-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="txt-modal-title" style="margin-bottom: 40px;">Expedition Details</h2>
            
            <form id="genForm">
                <label>Journey Timeline & Origin</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div>
                        <label style="font-size: 0.5rem; opacity: 0.6;">Departure Date</label>
                        <input type="date" id="startDate" required style="margin-bottom: 0;">
                    </div>
                    <div>
                        <label style="font-size: 0.5rem; opacity: 0.6;">Departure City (Origin)</label>
                        <input type="text" id="origin" placeholder="MUMBAI" required style="margin-bottom: 0;">
                    </div>
                </div>

                <label>Target Destination</label>
                <input type="text" id="dest" placeholder="DUBAI" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div>
                        <label>Stay Duration (Days)</label>
                        <input type="number" id="dur" value="3" min="1" style="margin-bottom: 0;">
                    </div>
                    <div>
                        <label>Total Guests</label>
                        <input type="number" id="passengers" value="1" min="1" style="margin-bottom: 0;">
                    </div>
                </div>

                <label>Financial Allocation</label>
                <div style="display: flex; gap: 15px; margin-bottom: 35px;">
                    <select id="currency" style="width: 35%; margin-bottom: 0;">
                        <option value="₹">₹ (INR)</option>
                        <option value="$">$ (USD)</option>
                        <option value="€">€ (EUR)</option>
                    </select>
                    <input type="number" id="budgetAmount" placeholder="Ex: 50,000" style="margin-bottom: 0;">
                </div>

                <label>Travel Priority</label>
                <select id="style">
                    <option value="Budget">Strict Budget (Economic)</option>
                    <option value="Moderate" selected>Balanced (Value for Money)</option>
                    <option value="Luxury">Premium (High-End)</option>
                </select>

                <button type="submit" class="btn" style="width: 100%;">Manifest Journey</button>
            </form>
          <div id="loadingUI" class="hidden">
    <div class="cyber-loader">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core"></div>
    </div>
    <div class="loader-text">Synchronizing with Oracle...</div>
</div>
        </div>
    </div>

    <script>
        // GLOBAL VARIABLE FOR MAP ANIMATION
        let myGlobe;

        const translations = {
            en: { hero: "The World,<br>By Design.", sub: "Intelligence in Global Travel", btn: "Begin Configuration", modal: "Expedition Details" },
            hi: { hero: "दुनिया,<br>आपकी पसंद।", sub: "वैश्विक यात्रा में बुद्धिमत्ता", btn: "शुरू करें", modal: "यात्रा का विवरण" },
            es: { hero: "El Mundo,<br>Por Diseño.", sub: "Inteligencia en Viajes Globales", btn: "Comenzar", modal: "Detalles de Expedición" }
        };

        function changeLanguage(lang) {
            document.getElementById('txt-hero').innerHTML = translations[lang].hero;
            document.getElementById('txt-subhero').innerText = translations[lang].sub;
            document.getElementById('txt-btn-main').innerText = translations[lang].btn;
            document.getElementById('txt-modal-title').innerText = translations[lang].modal;
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "289134521031-t8f77uqb8nsjska8ikrub4b07gqr4amr.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-login-btn"),
                { theme: "outline", size: "large" }
            );

            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    if(data.city) {
                        document.getElementById('origin').value = data.city.toUpperCase();
                        const curMap = { 'INR': '₹', 'USD': '$', 'EUR': '€' };
                        if(data.currency) document.getElementById('currency').value = curMap[data.currency] || '₹';
                    }
                });
        };

        function handleCredentialResponse(response) {
            alert("Login Successful! Authenticated via Google.");
        }

        // --- DASHBOARD LOGIC ---
        function toggleDashboard() {
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('resultUI').classList.add('hidden');
            document.getElementById('dashboardUI').style.display = 'block';
            
            fetch('https://ai-travel-p3rw.onrender.com/api/past_trips')
                .then(res => res.json())
                .then(data => {
                    const display = document.getElementById('archiveDisplay');
                    if(data.length === 0) {
                        display.innerHTML = "<p style='opacity:0.4'>The vault is currently empty.</p>";
                        return;
                    }
                    display.innerHTML = data.map(t => `
                        <div class="archive-card">
                            <small style="color:var(--gold)">${t.duration} DAY MISSION</small>
                            <h3 style="margin-top:15px; font-size: 1.8rem;">${t.destination}</h3>
                            <p style="opacity: 0.5; margin-top: 10px; font-size: 0.8rem;">Archived: ${new Date(t.created_at).toLocaleDateString()}</p>
                        </div>
                    `).join('');
                }).catch(err => {
                    document.getElementById('archiveDisplay').innerHTML = "<p style='color: red;'>Database sync failed.</p>";
                });
        }

        // --- GLOBE CONFIG ---
        fetch('https://unpkg.com/world-atlas/countries-110m.json').then(res => res.json()).then(data => {
            myGlobe = Globe()(document.getElementById('globeViz'))
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundColor('rgba(0,0,0,0)')
                .showAtmosphere(true).atmosphereColor('#3a82f6')
                .polygonsData(topojson.feature(data, data.objects.countries).features)
                .polygonCapColor(() => 'rgba(0,0,0,0)')
                .polygonStrokeColor(() => 'rgba(255,255,255,0.2)')
                .onPolygonClick(p => { 
                    document.getElementById('dest').value = p.properties.name.toUpperCase(); 
                    openModal(); 
                });
            myGlobe.controls().autoRotate = true; myGlobe.width(window.innerWidth).height(700);
            
            fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_populated_places_simple.geojson')
                .then(res => res.json()).then(places => {
                    myGlobe.labelsData(places.features)
                        .labelLat(d => d.properties.latitude).labelLng(d => d.properties.longitude)
                        .labelText(d => d.properties.name).labelSize(1.0).labelColor(() => 'white');
                });
        });

        // --- CORE ENGINE LOGIC ---
        function openModal() { document.getElementById('modalUI').classList.add('active'); }
        function closeModal() { document.getElementById('modalUI').classList.remove('active'); }
        document.querySelectorAll('.open-modal').forEach(b => b.onclick = openModal);

        document.getElementById('genForm').onsubmit = (e) => {
            e.preventDefault();
            document.getElementById('genForm').classList.add('hidden');
            document.getElementById('loadingUI').classList.remove('hidden');

            const payload = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('dest').value,
                departureDate: document.getElementById('startDate').value,
                duration: document.getElementById('dur').value,
                passengers: document.getElementById('passengers').value,
                budgetType: document.getElementById('style').value,
                maxBudget: document.getElementById('budgetAmount').value,
                currency: document.getElementById('currency').value
            };

            fetch('https://ai-travel-p3rw.onrender.com/api/generate_trip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                const ai = JSON.parse(data.itinerary);
                const fin = ai.costs || ai.financial_summary || ai.financials || {};
                const curSym = payload.currency; 

                // --- MAP ANIMATION HOOK ---
                if (ai.coordinates && myGlobe) {
                    myGlobe.arcsData([{
                        startLat: ai.coordinates.origin[0], startLng: ai.coordinates.origin[1],
                        endLat: ai.coordinates.dest[0], endLng: ai.coordinates.dest[1],
                        color: [['#d4af37', '#ffffff']]
                    }]);
                    myGlobe.arcDashLength(0.5).arcDashGap(2).arcDashAnimateTime(2000);
                }

                document.getElementById('mainUI').style.display = 'none';
                document.getElementById('resultUI').classList.remove('hidden');
                
                document.getElementById('rDest').innerText = payload.destination;
                document.getElementById('rMeta').innerText = `${payload.duration} DAYS • FROM ${payload.origin}`;
                document.getElementById('weatherText').innerText = ai.weather_advice || data.raw_weather || "Standard seasonal conditions.";
                document.getElementById('costFlight').innerText = `${curSym}${fin.flights || fin.airfare || '-'}`;
                document.getElementById('costHotel').innerText = `${curSym}${fin.hotels || fin.lodging || '-'}`;
                document.getElementById('costDaily').innerText = `${curSym}${fin.activities || fin.spending || '-'}`;
                document.getElementById('costTotal').innerText = `${curSym}${fin.total || '-'}`;

                document.getElementById('itineraryFlow').innerHTML = ai.itinerary.map(day => `
                    <div class="day-row">
                        <div class="day-num">${day.day < 10 ? '0'+day.day : day.day}</div>
                        <div class="act-group">
                            <div class="day-theme">${day.theme || 'Exploration'}</div>
                            <div class="act-block"><small>MORNING</small><p>${day.morning}</p></div>
                            <div class="act-block"><small>AFTERNOON</small><p>${day.afternoon}</p></div>
                            <div class="act-block"><small>EVENING</small><p>${day.evening}</p></div>
                        </div>
                    </div>
                `).join('');
                
                closeModal();
                window.scrollTo(0,0);
            });
        };

        document.getElementById('downloadPdf').onclick = () => {
            html2pdf().from(document.getElementById('resultUI')).set({
                margin: 20, filename: 'Travel_Manifest.pdf', html2canvas: { scale: 2, backgroundColor: '#050505' }
            }).save();
        };
    </script> 
</body>
</html>
